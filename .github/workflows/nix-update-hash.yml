name: Nix Dependency Hash

on:
  pull_request:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.*"
      - "package.json"
      - "package-lock.json"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix*.yml"
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "package.json"
      - "package-lock.json"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/server/**"
      - "packages/relay/**"
      - "packages/cli/**"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix-update-hash.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  update-hash:
    permissions:
      contents: read
      pull-requests: read
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      check: nix-hash
