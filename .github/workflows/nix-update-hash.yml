name: Nix Dependency Hash

on:
  pull_request:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.*"
      - "package.json"
      - "package-lock.json"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix*.yml"
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "package.json"
      - "package-lock.json"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix-update-hash.yml"

  workflow_dispatch:

concurrency:
  group: nix-hash-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update-hash:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_FALLBACK_BACKEND == 'aws' && format('runs-on={0}-{1}/runner=4cpu-linux-x64/volume=80gb:gp3:125mbs:3000iops/image=ubuntu24-full-x64', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Check packaging trigger coverage
        run: node --test scripts/packaging-workflow.test.mjs

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify committed lockfile and Nix hash
        run: |
          ./scripts/update-nix.sh --check
          git diff --exit-code -- package-lock.json nix/npm-deps.hash

      # nix.yml owns the default package build and daemon smoke for these inputs.
