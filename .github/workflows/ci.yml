name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ steps.filter.outputs.browser }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/upload-release-assets.test.mjs

  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: format
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: lint
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: typecheck
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: server-tests-ubuntu
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@getpaseo/server

      - name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@getpaseo/server

  # native-recursive.ts serves darwin and win32, but windows-latest above is the only
  # runner that exercises it. macOS — the platform the reported watcher bug was on —
  # otherwise has no server-test coverage. Scoped to the observer/watcher suites to
  # bound runtime.
  server-tests-macos:
    name: server-tests (macos-14, file observation)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: file-observation
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: desktop-tests-ubuntu
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@getpaseo/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=180 install -y xvfb xauth xdotool imagemagick

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Verify Windows daemon process control
        if: ${{ runner.os == 'Windows' }}
        run: npx vitest run packages/cli/src/commands/daemon/lifecycle.e2e.test.ts --bail=1 --maxWorkers=1 -t "Windows unbound|managed two-home"

      - name: Run desktop lifecycle E2E (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:e2e:lifecycle --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_LIFECYCLE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-lifecycle

      - name: Upload desktop lifecycle screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: desktop-lifecycle
          path: ${{ runner.temp }}/desktop-lifecycle
          if-no-files-found: ignore
          retention-days: 7

      - name: Run desktop lifecycle E2E (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:lifecycle --workspace=@getpaseo/desktop

      - name: Run desktop renderer E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:renderer --workspace=@getpaseo/desktop

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:browser-tabs --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      - name: Upload desktop browser diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: app-tests
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  sdk-tests:
    name: sdk-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: sdk-tests
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  playwright-1:
    name: playwright (shard 1/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: playwright-1
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  playwright-2:
    name: playwright (shard 2/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: playwright-2
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  playwright-3:
    name: playwright (shard 3/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: playwright-3
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  playwright-4:
    name: playwright (shard 4/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: playwright-4
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  relay-tests:
    name: relay-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: relay-tests
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: cli-tests-1
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: cli-tests-2
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    uses: SAVAGExSTRATEGIC/paseo/.github/workflows/local-tart-ci.yml@main
    with:
      check: cli-tests-3
      expected_head: ${{ github.sha }}
      pull_request: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  ci-result:
    name: CI result
    # A short result-only job must report failure even when a dependency fails or is cancelled.
    if: ${{ always() }}
    needs:
      - changes
      - format
      - lint
      - typecheck
      - server-tests-ubuntu
      - server-tests-windows
      - server-tests-macos
      - desktop-tests-ubuntu
      - desktop-tests-windows
      - app-tests
      - sdk-tests
      - playwright-1
      - playwright-2
      - playwright-3
      - playwright-4
      - relay-tests
      - cli-tests-1
      - cli-tests-2
      - cli-tests-3
    runs-on: windows-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every affected check to succeed
        shell: bash
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'CI_RESULT_GATE'
          const needs = JSON.parse(process.env.CI_NEEDS);
          const contracts = {"format":["format"],"lint":["quality"],"typecheck":["quality"],"server-tests-ubuntu":["server","hub"],"server-tests-windows":["server","hub"],"server-tests-macos":["server"],"desktop-tests-ubuntu":["desktop"],"desktop-tests-windows":["desktop"],"app-tests":["app"],"sdk-tests":["sdk"],"playwright-1":["browser"],"playwright-2":["browser"],"playwright-3":["browser"],"playwright-4":["browser"],"relay-tests":["relay"],"cli-tests-1":["cli"],"cli-tests-2":["cli"],"cli-tests-3":["cli"]};
          const expected = ['changes', ...Object.keys(contracts)];
          if (Object.keys(needs).length !== expected.length || expected.some(name => !needs[name])) {
            throw new Error('Incomplete CI result inventory');
          }
          if (needs.changes.result !== 'success') throw new Error('CI change detection did not succeed');
          const outputs = needs.changes.outputs;
          const flags = ['full', ...new Set(Object.values(contracts).flat())];
          if (!outputs || flags.some(flag => !['true', 'false'].includes(outputs[flag]))) {
            throw new Error('Missing or invalid CI change flags');
          }
          for (const [name, areas] of Object.entries(contracts)) {
            const required = outputs.full === 'true' || areas.some(area => outputs[area] === 'true');
            const result = needs[name].result;
            if (result !== 'success' && (required || result !== 'skipped')) {
              throw new Error(`CI check ${name} did not succeed (${result})`);
            }
          }
          CI_RESULT_GATE
