# Commission only after host, network, credentials and runner identity are verified.
# Public source executes only in disposable network-isolated guests with read-only tokens.
name: Local Tart CI
run-name: Tart macOS ${{ github.event.pull_request.number || inputs.pull_request || 'main' }} @ ${{ github.event.pull_request.head.sha || inputs.expected_head || github.sha }}
"on":
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open, non-draft PR; leave blank to qualify exact current main
        required: false
        type: string
      expected_head:
        description: Exact 40-character PR head or current main SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: paseo-tart-${{ github.event.pull_request.number || inputs.pull_request || 'main' }}
  cancel-in-progress: false
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  server-tests-macos:
    name: Tart macOS file observation
    if:
      ${{ vars.PASEO_PUBLIC_CI_COMMISSIONED == 'true' && contains(fromJSON('["workflow_dispatch","push","pull_request_target"]'), github.event_name) && github.ref
      == 'refs/heads/main' }}
    runs-on:
      group: Paseo Isolated CI
      labels:
        - self-hosted
        - macOS
        - ARM64
        - paseo-isolated-macos
    outputs:
      tested-head: ${{ steps.source.outputs.head }}
    steps:
      - name: Verify trusted main and immutable source before checkout
        id: source
        shell: bash
        env:
          EXPECTED_PR: ${{ github.event.pull_request.number || inputs.pull_request }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'SOURCE_GATE'
          const repo = 'SAVAGExSTRATEGIC/paseo';
          const repositoryId = 1382441324;
          const workflow = `${repo}/.github/workflows/local-tart-ci.yml@refs/heads/main`;
          const env = process.env;
          if (env.GITHUB_REPOSITORY !== repo || env.GITHUB_REPOSITORY_ID !== String(repositoryId) ||
              env.GITHUB_REF !== 'refs/heads/main' || env.GITHUB_WORKFLOW_REF !== workflow ||
              !['workflow_dispatch', 'push', 'pull_request_target'].includes(env.GITHUB_EVENT_NAME) || env.GITHUB_WORKFLOW_SHA !== env.GITHUB_SHA) {
            throw new Error('Untrusted workflow origin');
          }
          const pr = env.EXPECTED_PR || '';
          if ((env.GITHUB_EVENT_NAME === 'pull_request_target' && pr === '') ||
              (env.GITHUB_EVENT_NAME === 'push' && pr !== '')) {
            throw new Error('Event and source kind differ');
          }
          if ((pr !== '' && !/^[1-9][0-9]*$/.test(pr)) || !/^[0-9a-f]{40}$/.test(env.EXPECTED_HEAD)) {
            throw new Error('Invalid source input');
          }
          const read = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              headers: {Authorization: `Bearer ${env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error('GitHub source read failed');
            return response.json();
          };
          const main = await read('commits/main');
          if (main.sha !== env.GITHUB_SHA) throw new Error('Trusted main changed');
          if (pr === '') {
            if (env.EXPECTED_HEAD !== main.sha) throw new Error('Main qualification head differs');
          } else {
            const pull = await read(`pulls/${pr}`);
            if (pull.state !== 'open' || pull.draft || pull.head.sha !== env.EXPECTED_HEAD ||
                pull.head.repo.full_name !== repo || pull.head.repo.id !== repositoryId ||
                pull.base.repo.full_name !== repo || pull.base.repo.id !== repositoryId ||
                pull.base.ref !== 'main' || pull.base.sha !== main.sha) {
              throw new Error('Source changed or is outside admitted repository');
            }
          }
          SOURCE_GATE
          printf 'head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SAVAGExSTRATEGIC/paseo
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server dependencies
        run: npm run build:server-deps
      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@getpaseo/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1
    timeout-minutes: 30

  report-pr:
    name: Report Tart result to exact PR head
    needs: server-tests-macos
    if: ${{ always() && github.event_name == 'pull_request_target' && needs.server-tests-macos.outputs.tested-head != '' }}
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish only to the still-current admitted PR head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ needs.server-tests-macos.outputs.tested-head }}
          TEST_RESULT: ${{ needs.server-tests-macos.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'SAVAGExSTRATEGIC/paseo' -or $env:EXPECTED_PR -notmatch '^[1-9][0-9]*$' -or $env:EXPECTED_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Invalid result identity' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = 'https://api.github.com/repos/SAVAGExSTRATEGIC/paseo'
          $pr = Invoke-RestMethod -Headers $headers -Uri "$base/pulls/$env:EXPECTED_PR" -TimeoutSec 30
          if ($pr.state -ne 'open' -or $pr.head.sha -ne $env:EXPECTED_HEAD -or $pr.head.repo.id -ne 1382441324 -or $pr.base.repo.id -ne 1382441324 -or $pr.base.ref -ne 'main') { throw 'PR changed; refusing stale result' }
          $state = if ($env:TEST_RESULT -eq 'success') { 'success' } else { 'failure' }
          $body = @{ state = $state; context = 'local-tart/macos'; description = "Isolated local Tart: $env:TEST_RESULT"; target_url = "https://github.com/SAVAGExSTRATEGIC/paseo/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -Uri "$base/statuses/$env:EXPECTED_HEAD" -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null
