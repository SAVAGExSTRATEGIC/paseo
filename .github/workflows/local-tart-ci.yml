# Historical reusable path retained for existing callers, including PR18.
# Local CI is retired: execute unchanged checks on standard disposable cloud runners.
name: Cloud compatibility CI
run-name: Cloud ${{ inputs.check || 'file-observation' }} ${{ github.event.pull_request.number || inputs.pull_request || 'main' }} @ ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
"on":
  workflow_call:
    inputs:
      expected_head:
        required: true
        type: string
      pull_request:
        required: false
        default: ""
        type: string
      check:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      check:
        description: Fixed check name; file-observation and nix-macos use macOS
        required: false
        default: file-observation
        type: string
      pull_request:
        description: Open, non-draft PR; leave blank to qualify exact current main
        required: false
        type: string
      expected_head:
        description: Exact 40-character PR head or current main SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: paseo-tart-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}-${{ inputs.check || 'file-observation' }}
  cancel-in-progress: false
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  server-tests-macos:
    name: Cloud ${{ inputs.check || 'file-observation' }}
    runs-on: ${{ (!inputs.check || inputs.check == 'file-observation' || inputs.check == 'nix-macos') && 'macos-26' || 'ubuntu-24.04' }}
    outputs:
      tested-head: ${{ steps.source.outputs.head }}
    steps:
      - name: Verify trusted main and immutable source before checkout
        id: source
        shell: bash
        env:
          EXPECTED_PR: ${{ github.event.pull_request.number || inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SOURCE_CHECK: ${{ inputs.check || 'file-observation' }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          EVENT_MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          node --input-type=module <<'SOURCE_GATE'
          const repo = 'SAVAGExSTRATEGIC/paseo';
          const repositoryId = 1382441324;
          const workflow = `${repo}/.github/workflows/local-tart-ci.yml@refs/heads/main`;
          const env = process.env;
          const checks = ["file-observation", "format", "lint", "typecheck", "server-tests-ubuntu", "desktop-tests-ubuntu", "app-tests", "sdk-tests", "playwright-1", "playwright-2", "playwright-3", "playwright-4", "relay-tests", "cli-tests-1", "cli-tests-2", "cli-tests-3", "nix-linux", "nix-hash", "nix-macos", "docker-build"];
          if (env.GITHUB_REPOSITORY !== repo || env.GITHUB_REPOSITORY_ID !== String(repositoryId) ||
              env.JOB_WORKFLOW_REF !== workflow || !/^[0-9a-f]{40}$/.test(env.JOB_WORKFLOW_SHA) ||
              !['workflow_dispatch', 'push', 'pull_request_target', 'pull_request', 'merge_group'].includes(env.GITHUB_EVENT_NAME) ||
              !checks.includes(env.SOURCE_CHECK)) throw new Error('Untrusted workflow origin or check');
          const pr = env.EXPECTED_PR || '';
          const event = env.GITHUB_EVENT_NAME;
          if ((pr !== '' && !/^[1-9][0-9]*$/.test(pr)) || !/^[0-9a-f]{40}$/.test(env.EXPECTED_HEAD)) {
            throw new Error('Invalid source input');
          }
          const read = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              headers: {Authorization: `Bearer ${env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error('GitHub source read failed');
            return response.json();
          };
          const main = await read('commits/main');
          if (main.sha !== env.JOB_WORKFLOW_SHA) throw new Error('Trusted main changed');
          if (event === 'merge_group') {
            if (pr !== '' || !/^refs\/heads\/gh-readonly-queue\/main\/[A-Za-z0-9._/-]+$/.test(env.GITHUB_REF) ||
                env.EXPECTED_HEAD !== env.GITHUB_SHA || env.EXPECTED_HEAD !== env.EVENT_MERGE_HEAD ||
                env.EVENT_MERGE_BASE !== main.sha) throw new Error('Merge queue source differs');
            const ref = await read(`git/ref/${env.GITHUB_REF.slice(5)}`);
            if (ref.object?.sha !== env.EXPECTED_HEAD) throw new Error('Merge queue ref changed');
          } else if (pr === '') {
            if (['pull_request', 'pull_request_target'].includes(event) || env.GITHUB_REF !== 'refs/heads/main' ||
                env.EXPECTED_HEAD !== main.sha || env.GITHUB_SHA !== main.sha) throw new Error('Main source differs');
          } else {
            if (event === 'push') throw new Error('Push cannot select a PR');
            const pull = await read(`pulls/${pr}`);
            const fromPR = event === 'pull_request';
            if (pull.state !== 'open' || pull.draft ||
                pull.head.repo.full_name !== repo || pull.head.repo.id !== repositoryId ||
                pull.base.repo.full_name !== repo || pull.base.repo.id !== repositoryId ||
                pull.base.ref !== 'main' || pull.base.sha !== main.sha ||
                (fromPR ? (env.GITHUB_REF !== `refs/pull/${pr}/merge` || env.GITHUB_SHA !== env.EXPECTED_HEAD ||
                  pull.merge_commit_sha !== env.EXPECTED_HEAD || pull.head.sha !== env.EVENT_PR_HEAD) :
                  (env.GITHUB_REF !== 'refs/heads/main' || env.GITHUB_SHA !== main.sha || pull.head.sha !== env.EXPECTED_HEAD))) {
              throw new Error('Source changed or is outside admitted repository');
            }
          }
          SOURCE_GATE
          printf 'head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - name: Read fixed check commands from the trusted workflow revision
        if: ${{ inputs.check && inputs.check != 'file-observation' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SAVAGExSTRATEGIC/paseo
          ref: ${{ job.workflow_sha }}
          path: .ci-control
          sparse-checkout: scripts/local-tart-check.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Retain trusted check commands outside the tested checkout
        if: ${{ inputs.check && inputs.check != 'file-observation' }}
        shell: bash
        run: install -m 0500 .ci-control/scripts/local-tart-check.sh "$RUNNER_TEMP/paseo-tart-check.sh"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SAVAGExSTRATEGIC/paseo
          ref: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Use job-local Playwright browser storage
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/playwright-browsers"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/playwright-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        if: ${{ !startsWith(inputs.check, 'nix-') && inputs.check != 'docker-build' }}
        run: node scripts/npm-retry.mjs ci
      - name: Build server dependencies
        if: ${{ !inputs.check || inputs.check == 'file-observation' }}
        run: npm run build:server-deps
      - name: Run file observation tests
        if: ${{ !inputs.check || inputs.check == 'file-observation' }}
        run: |
          npm run test:unit --workspace=@getpaseo/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1
      - name: Install pinned Nix on disposable cloud Linux
        if: ${{ inputs.check == 'nix-linux' || inputs.check == 'nix-hash' }}
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Enable cross-architecture Docker builds on cloud Linux
        if: ${{ inputs.check == 'docker-build' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          cache-image: false
      - name: Set up disposable Docker builder
        if: ${{ inputs.check == 'docker-build' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          cache-binary: false
      - name: Read package version
        id: package
        if: ${{ inputs.check == 'docker-build' }}
        shell: bash
        run: node -e 'const v=require("./package.json").version;if(!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(v))throw Error("Invalid package version");require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,"version="+v+"\n");'
      - name: Build both Docker architectures without publishing or remote caches
        if: ${{ inputs.check == 'docker-build' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: PASEO_VERSION=${{ steps.package.outputs.version }}
          push: false
          provenance: false
      - name: Run selected cloud check
        if: ${{ inputs.check && inputs.check != 'file-observation' && inputs.check != 'docker-build' }}
        shell: bash
        env:
          SOURCE_CHECK: ${{ inputs.check }}
        run: /bin/bash "$RUNNER_TEMP/paseo-tart-check.sh" "$SOURCE_CHECK"
    # Preserve the original desktop bound; packaging keeps its existing budget.
    timeout-minutes: ${{ inputs.check == 'desktop-tests-ubuntu' && 30 || 90 }}
